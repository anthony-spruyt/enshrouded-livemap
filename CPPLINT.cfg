set noparent
linelength=200
# Includes are relative to the including file, so they name no directory
filter=-build/include_subdir
# The licence is in LICENSE, not in a copyright line per file
filter=-legal/copyright
# printf %ll arguments are cast to long long on purpose, so the format matches on every ABI
filter=-runtime/int
# clang-format owns the layout: access specifiers at class level, aligned continuation lines, trailing comment spacing
filter=-whitespace/indent,-whitespace/indent_namespace,-whitespace/comments
# The tools build as C++23, where <filesystem> is standard
filter=-build/c++17
# __except (...) is MSVC structured exception syntax
filter=-whitespace/parens
